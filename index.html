<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Campañas & Ventas</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#7c3aed" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Campañas" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <header class="topbar" id="topbar">
    <button id="backBtn" class="btn-icon hidden">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="pageTitle">Campañas & Ventas</h1>
    <div id="topbarActions"></div>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-view="dashboard">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="nav-item" data-view="campanias">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span>Campañas</span>
    </button>
    <button class="nav-item" data-view="ventas">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/><path d="M9 1v2M15 1v2M9 21v2M15 21v2"/></svg>
      <span>Ventas</span>
    </button>
  </nav>

  <button id="fab" class="fab hidden" aria-label="Agregar">+</button>

</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" id="modal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
